name: temporary-typecheck

on:
  push:
    branches: ["main"]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save typescript@5.8.3
      - run: npx tsc --noEmit
